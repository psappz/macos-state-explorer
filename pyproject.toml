[project]
name = "macos-state-explorer"
version = "1.1.1"
description = "Read-only macOS privacy, TCC and LaunchServices state explorer"
requires-python = ">=3.10"
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "pydantic>=2",
  "jinja2>=3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
mse = "macos_state_explorer.cli:app"

[tool.setuptools.packages.find]
where = ["src"]
