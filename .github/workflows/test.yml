name: test

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Ruff
        run: ruff check .

      - name: Pytest
        run: pytest

      - name: Generate HTML report artifacts
        run: |
          mkdir -p ci-artifacts/html
          python - <<'PY'
          from pathlib import Path

          from macos_state_explorer.launchservices.models import LaunchServicesRecord, LaunchServicesStatus
          from macos_state_explorer.reports.launchservices_html import write_launchservices_html

          payload = {
              "entries": [
                  LaunchServicesRecord(
                      raw_block="ci sample",
                      bundle_id="com.example.CI",
                      display_name="CI Sample",
                      version="1.0",
                      path_clean="/Applications/CI Sample.app",
                      path_exists=False,
                      volume="/",
                      volume_exists=True,
                      classification=LaunchServicesStatus.STALE,
                  ).model_dump(mode="python")
              ]
          }
          write_launchservices_html(Path("ci-artifacts/html"), payload)
          PY

      - name: Upload HTML report artifacts
        uses: actions/upload-artifact@v4
        with:
          name: html-reports-python-${{ matrix.python-version }}
          path: ci-artifacts/html/**/*.html
          if-no-files-found: error
